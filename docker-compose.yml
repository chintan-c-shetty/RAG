services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: rag_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API + web dashboard
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage   # vectors survive container restarts

volumes:
  qdrant_data:
